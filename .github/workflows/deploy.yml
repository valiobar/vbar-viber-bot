name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: admin
            dockerfile: services/admin/Dockerfile
          - service: viber
            dockerfile: services/viber/Dockerfile
          - service: ai
            dockerfile: services/ai/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vbar-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/vbar-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Optional: set DEPLOY_PATH secret to the repo checkout on the VPS
          # (defaults to ~/vbar-viber-bot if unset / empty)
          envs: IMAGE_TAG
          script: |
            set -e
            REPO_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$REPO_DIR" ]; then
              REPO_DIR="$HOME/vbar-viber-bot"
            fi
            cd "$REPO_DIR"
            if [ ! -f .env ]; then
              echo "ERROR: .env missing on server. Create it once from .env.example."
              exit 1
            fi
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi
            export IMAGE_TAG
            bash deploy.sh
        env:
          IMAGE_TAG: ${{ github.sha }}
