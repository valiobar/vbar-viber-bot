version: "3.8"

services:
  # MongoDB Instances
  mongodb-admin:
    image: mongo:7
    container_name: vbar-mongodb-admin
    ports:
      - "27017:27017" # Expose for local access
    environment:
      - MONGO_INITDB_DATABASE=admin
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ADMIN_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ADMIN_PASS:-admin123}
    volumes:
      - mongodb-admin-data:/data/db
    restart: unless-stopped
    networks:
      - vbar-network
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_ADMIN_USER:-admin}",
          "-p",
          "${MONGO_ADMIN_PASS:-admin123}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb-bot:
    image: mongo:7
    container_name: vbar-mongodb-bot
    ports:
      - "27018:27017" # Expose for local access
    environment:
      - MONGO_INITDB_DATABASE=bot
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_BOT_USER:-bot}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_BOT_PASS:-bot123}
    volumes:
      - mongodb-bot-data:/data/db
    restart: unless-stopped
    networks:
      - vbar-network
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_BOT_USER:-bot}",
          "-p",
          "${MONGO_BOT_PASS:-bot123}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb-ai:
    image: mongo:7
    container_name: vbar-mongodb-ai
    ports:
      - "27019:27017" # Expose for local access
    environment:
      - MONGO_INITDB_DATABASE=ai
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_AI_USER:-ai}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_AI_PASS:-ai123}
    volumes:
      - mongodb-ai-data:/data/db
    restart: unless-stopped
    networks:
      - vbar-network
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_AI_USER:-ai}",
          "-p",
          "${MONGO_AI_PASS:-ai123}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb-analytics:
    image: mongo:7
    container_name: vbar-mongodb-analytics
    ports:
      - "27020:27017" # Expose for local access
    environment:
      - MONGO_INITDB_DATABASE=analytics
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ANALYTICS_USER:-analytics}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ANALYTICS_PASS:-analytics123}
    volumes:
      - mongodb-analytics-data:/data/db
    restart: unless-stopped
    networks:
      - vbar-network
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_ANALYTICS_USER:-analytics}",
          "-p",
          "${MONGO_ANALYTICS_PASS:-analytics123}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb-web3:
    image: mongo:7
    container_name: vbar-mongodb-web3
    ports:
      - "27021:27017" # Expose for local access
    environment:
      - MONGO_INITDB_DATABASE=web3
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_WEB3_USER:-web3}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_WEB3_PASS:-web3123}
    volumes:
      - web3-mongo-data:/data/db
    restart: unless-stopped
    networks:
      - vbar-network
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_WEB3_USER:-web3}",
          "-p",
          "${MONGO_WEB3_PASS:-web3123}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vbar-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-admin}
    ports:
      - "5672:5672" # AMQP port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - vbar-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  vbar-network:
    driver: bridge
    name: vbar-network

volumes:
  mongodb-admin-data:
    name: vbar-mongodb-admin-data
  mongodb-bot-data:
    name: vbar-mongodb-bot-data
  mongodb-ai-data:
    name: vbar-mongodb-ai-data
  mongodb-analytics-data:
    name: vbar-mongodb-analytics-data
  web3-mongo-data:
    name: vbar-mongodb-web3-data
  rabbitmq-data:
    name: vbar-rabbitmq-data
