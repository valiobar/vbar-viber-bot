apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vbar-ingress
  namespace: vbar-viber-bot
  labels:
    app: vbar-viber-bot
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Uncomment for rate limiting
    # nginx.ingress.kubernetes.io/limit-rps: "100"
    # nginx.ingress.kubernetes.io/limit-connections: "10"
spec:
  ingressClassName: nginx
  rules:
  # Admin Service
  - host: admin.vbar.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin-service
            port:
              number: 80
  
  # API Services
  - host: api.vbar.local
    http:
      paths:
      # Viber Service
      - path: /api/viber
        pathType: Prefix
        backend:
          service:
            name: viber-service
            port:
              number: 80
      # AI Service
      - path: /api/ai
        pathType: Prefix
        backend:
          service:
            name: ai-service
            port:
              number: 80
      # Analytics Service
      - path: /api/analytics
        pathType: Prefix
        backend:
          service:
            name: analytics-service
            port:
              number: 80
  
  # TLS Configuration (uncomment and configure for production)
  # tls:
  # - hosts:
  #   - admin.vbar.local
  #   - api.vbar.local
  #   secretName: vbar-tls-secret






