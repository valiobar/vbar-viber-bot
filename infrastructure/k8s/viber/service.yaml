apiVersion: v1
kind: Service
metadata:
  name: viber-service
  namespace: vbar-viber-bot
  labels:
    app: viber-service
    component: viber
    service: viber
spec:
  type: ClusterIP
  selector:
    app: viber-service
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3001
  sessionAffinity: None

