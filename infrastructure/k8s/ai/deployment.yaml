apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: vbar-viber-bot
  labels:
    app: ai-service
    component: ai
    service: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        component: ai
        service: ai
    spec:
      containers:
      - name: ai
        image: vbar-ai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3002
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: vbar-config
              key: NODE_ENV
        - name: PORT
          value: "3002"
        - name: MONGODB_URI
          valueFrom:
            configMapKeyRef:
              name: vbar-config
              key: MONGODB_AI_URI
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: vbar-config
              key: RABBITMQ_URL
        - name: OLLAMA_URL
          valueFrom:
            configMapKeyRef:
              name: vbar-config
              key: OLLAMA_URL
        - name: AI_MODEL_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: vbar-config
              key: AI_MODEL_PROVIDER
        - name: AI_MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: vbar-config
              key: AI_MODEL_NAME
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: vbar-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: vbar-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 12
      restartPolicy: Always








