apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: vbar-viber-bot
  labels:
    app: ai-service
    component: ai
    service: ai
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3002
  - name: grpc
    protocol: TCP
    port: 50051
    targetPort: 50051
  sessionAffinity: None

