apiVersion: v1
kind: Service
metadata:
  name: mongodb-ai
  namespace: vbar-viber-bot
  labels:
    app: mongodb-ai
    component: database
    service: ai-db
spec:
  type: ClusterIP
  selector:
    app: mongodb-ai
  ports:
  - name: mongodb
    protocol: TCP
    port: 27017
    targetPort: 27017
  clusterIP: None
  publishNotReadyAddresses: false






