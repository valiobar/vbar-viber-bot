apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb-ai
  namespace: vbar-viber-bot
  labels:
    app: mongodb-ai
    component: database
    service: ai-db
spec:
  serviceName: mongodb-ai
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-ai
  template:
    metadata:
      labels:
        app: mongodb-ai
        component: database
        service: ai-db
    spec:
      containers:
      - name: mongodb
        image: mongo:7
        ports:
        - name: mongodb
          containerPort: 27017
          protocol: TCP
        env:
        - name: MONGO_INITDB_DATABASE
          value: "ai"
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - db.adminCommand('ping')
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - mongosh
            - --eval
            - db.adminCommand('ping')
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: mongodb-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 20Gi








